name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node 20 reached end of life on 2026-04-30 and is not supported. The matrix
# covers the two live LTS lines: 22 (EOL 2027-04) and 24 (EOL 2028-04). Both
# clear tsdown's own floor of ^22.18 || >=24.11, so every runtime that can run
# the server can also build it — building and testing therefore share one job,
# and the bundle gets smoke-tested on each runtime rather than just one.
#
# npm 10 cannot resolve tsdown's dependency tree at all, failing with an
# unhelpful `Cannot read properties of null (reading 'edgesOut')`, so each job
# upgrades npm before installing.
env:
  NPM_VERSION: '11'

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Verify the runner satisfies the bundler's Node floor
        # Guards the matrix itself: adding a runtime the bundler cannot use
        # should fail here with a clear message, not deep inside a build.
        run: |
          node --input-type=module -e "
            const [maj, min] = process.versions.node.split('.').map(Number)
            const ok = (maj === 22 && min >= 18) || maj >= 24
            if (!ok) {
              console.error(\`tsdown needs Node ^22.18 || >=24.11, runner has \${process.versions.node}\`)
              process.exit(1)
            }
            console.error(\`node \${process.versions.node} satisfies the build floor\`)
          "

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (offline)
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the bundle over stdio, unauthenticated
        # Proves the artifact starts and serves an MCP session with no
        # credentials present, not merely that it compiles.
        run: npx vite-node scripts/smoke-stdio-handshake.ts -- node dist/index.js

      - name: Generated tool list is current
        # A hand-maintained table of fifty tools goes stale in one release and
        # then lies about what is installed. Regenerating must be a no-op.
        run: |
          npm run docs:tools
          git diff --exit-code -- docs/tools.md || {
            echo '::error::docs/tools.md is stale — run `npm run docs:tools` and commit the result.'
            exit 1
          }

      - name: Package contents
        # Proves the tarball is the bundle and nothing else: no environment
        # files, no sources, no tests, and exactly one entrypoint. The OpenAPI
        # spec is inlined at build time, so it must not ship separately either.
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const files = JSON.parse(readFileSync('pack.json', 'utf8'))[0].files.map(f => f.path)
            const forbidden = files.filter(f =>
              /(^|\/)\.env($|\.)/.test(f) || f.endsWith('.test.js') || f.endsWith('.test.ts') ||
              f.startsWith('src/') || f.startsWith('assets/')
            )
            if (forbidden.length) {
              console.error('Tarball would ship files it must not:', forbidden)
              process.exit(1)
            }
            const js = files.filter(f => f.endsWith('.js'))
            if (js.length !== 1 || js[0] !== 'dist/index.js') {
              console.error('Expected exactly one bundled entrypoint, got:', js)
              process.exit(1)
            }
            console.error(\`tarball: \${files.length} files, single bundle, no secrets, no sources\`)
          "

  docker:
    name: container image
    runs-on: ubuntu-latest
    # Aggregators build and run this image; a broken build there withholds the
    # listing entirely, so it cannot be allowed to rot behind the bundler.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Build the image
        run: docker build -t websupport-mcp:ci .

      - name: Smoke-test the container over stdio, unauthenticated
        run: npx vite-node scripts/smoke-stdio-handshake.ts -- docker run -i --rm websupport-mcp:ci

  live-api:
    name: live API probes (non-blocking)
    runs-on: ubuntu-latest
    # Deliberately advisory. These suites reach the real Websupport API without
    # credentials — an outage upstream must never red this repository's build,
    # but drift must still be visible. Keep this job out of branch protection.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Market hosts and OpenAPI drift
        run: npm run test:network
