name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here publishes on its own. Changesets opens a "Version Packages" pull
# request that collects pending changesets into a version bump and changelog;
# publishing happens only when a human merges that pull request. Until then this
# workflow just keeps the release PR up to date.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_VERSION: '11'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version bump commit and the release PR
      pull-requests: write # open and update that PR
      id-token: write # mint the OIDC token npm provenance is signed with
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs history to work out what has already been released.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        # npm 10 cannot resolve the bundler's dependency tree, and trusted
        # publishing needs >= 11.5.1.
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Verify npm is new enough for trusted publishing
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process'
            const v = execFileSync('npm', ['-v'], { encoding: 'utf8' }).trim()
            const [maj, min, patch] = v.split('.').map(Number)
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)))
            if (!ok) {
              console.error(\`trusted publishing needs npm >= 11.5.1, have \${v}\`)
              process.exit(1)
            }
            console.error(\`npm \${v} supports trusted publishing\`)
          "

      - run: npm ci

      # The published artifact is built and checked here rather than trusted:
      # a release must not be the first time these run.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Changesets — open a release PR, or publish a merged one
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:version
          publish: npm run release:publish
          title: 'chore: release'
          commit: 'chore: release'
        env:
          # No npm credential. Publishing authenticates through trusted
          # publishing: the npm CLI detects the OIDC environment from the
          # `id-token: write` permission above and uses it in preference to any
          # token. Provenance attestations are generated automatically on that
          # path, so `--provenance` is not passed either.
          #
          # Requires npm >= 11.5.1 and Node >= 22.14, both satisfied above, and
          # a trusted publisher registered on npmjs.com for this repository and
          # this workflow filename.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The MCP Registry references the npm package, so it is only meaningful
      # once the publish above has succeeded. Authenticated by the same OIDC
      # identity as npm — no credential, and no interactive browser login.
      #
      # `workflow_dispatch` is an escape hatch: it lets the registry entry be
      # (re)published for the current version without a new release, which is
      # how the first entry was created after the package was already on npm.
      - name: Publish to the MCP Registry
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISHER_VERSION: v1.8.1
          # Pinned so a tampered or swapped release binary fails loudly rather
          # than running with permission to publish under this namespace.
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Report
        if: always()
        run: |
          echo "published: ${{ steps.changesets.outputs.published }}"
          echo "pull request: ${{ steps.changesets.outputs.pullRequestNumber }}"
