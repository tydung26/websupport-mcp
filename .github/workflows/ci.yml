name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The bundler's Node floor is higher than the package's own. tsdown requires
# Node ^22.18 || >=24.11, while the published server runs on Node >=20. So the
# two are tested separately: `check` proves the code works on every supported
# runtime, `build` produces the artifact on a runtime new enough to build it.
# npm 10 cannot resolve tsdown's dependency tree at all, so every job upgrades
# npm before installing.
env:
  NPM_VERSION: '11'

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      # tsdown is installed here but never invoked on Node 20 — npm reports an
      # engine mismatch as a warning, which is the intended outcome.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (offline)
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Verify the runner satisfies the bundler's Node floor
        run: |
          node --input-type=module -e "
            const [maj, min] = process.versions.node.split('.').map(Number)
            const ok = (maj === 22 && min >= 18) || maj >= 24
            if (!ok) {
              console.error(\`tsdown needs Node ^22.18 || >=24.11, runner has \${process.versions.node}\`)
              process.exit(1)
            }
            console.error(\`node \${process.versions.node} satisfies the build floor\`)
          "

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-test the bundle over stdio
        # Proves the artifact actually starts and answers an MCP handshake,
        # rather than merely compiling. No credentials are needed to reach
        # tools/list.
        run: |
          node --input-type=module -e "
            import { spawn } from 'node:child_process'
            const child = spawn('node', ['dist/index.js'], {
              env: { ...process.env, WEBSUPPORT_API_KEY: 'ci', WEBSUPPORT_API_SECRET: 'ci' },
              stdio: ['pipe', 'pipe', 'inherit'],
            })
            let buffer = ''
            const send = (m) => child.stdin.write(JSON.stringify(m) + '\n')
            const timer = setTimeout(() => { console.error('handshake timed out'); process.exit(1) }, 20000)
            child.stdout.on('data', (chunk) => {
              buffer += chunk
              let i
              while ((i = buffer.indexOf('\n')) >= 0) {
                const line = buffer.slice(0, i).trim()
                buffer = buffer.slice(i + 1)
                if (!line) continue
                const msg = JSON.parse(line)
                if (msg.id === 1) {
                  send({ jsonrpc: '2.0', method: 'notifications/initialized' })
                  send({ jsonrpc: '2.0', id: 2, method: 'tools/list' })
                } else if (msg.id === 2) {
                  const n = msg.result.tools.length
                  console.error(\`handshake ok, \${n} tools with no opt-ins\`)
                  clearTimeout(timer)
                  child.kill()
                  process.exit(n === 30 ? 0 : 1)
                }
              }
            })
            send({ jsonrpc: '2.0', id: 1, method: 'initialize', params: {
              protocolVersion: '2025-11-25', capabilities: {},
              clientInfo: { name: 'ci', version: '0' },
            }})
          "

      - name: Package contents
        # Proves the tarball is the bundle and nothing else: no environment
        # files, no sources, no tests, and exactly one entrypoint. The OpenAPI
        # spec is inlined at build time, so it must not ship separately either.
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const files = JSON.parse(readFileSync('pack.json', 'utf8'))[0].files.map(f => f.path)
            const forbidden = files.filter(f =>
              /(^|\/)\.env($|\.)/.test(f) || f.endsWith('.test.js') || f.endsWith('.test.ts') ||
              f.startsWith('src/') || f.startsWith('assets/')
            )
            if (forbidden.length) {
              console.error('Tarball would ship files it must not:', forbidden)
              process.exit(1)
            }
            const js = files.filter(f => f.endsWith('.js'))
            if (js.length !== 1 || js[0] !== 'dist/index.js') {
              console.error('Expected exactly one bundled entrypoint, got:', js)
              process.exit(1)
            }
            console.error(\`tarball: \${files.length} files, single bundle, no secrets, no sources\`)
          "

  live-api:
    name: live API probes (non-blocking)
    runs-on: ubuntu-latest
    # Deliberately advisory. These suites reach the real Websupport API without
    # credentials — an outage upstream must never red this repository's build,
    # but drift must still be visible. Keep this job out of branch protection.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Market hosts and OpenAPI drift
        run: npm run test:network
